name: release
# Push a tag like v0.2.0 (or run manually) to build the ISO and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Enable KVM (KIWI boxbuild runs the build in a VM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: .cache/kiwi-boxes
          key: kiwi-boxes-v1
      - name: Restore package cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pkg-cache
          key: pkg-cache-${{ github.run_id }}
          restore-keys: pkg-cache-
      - name: Build ISO
        env:
          FEDORA_MIRROR: https://dl.fedoraproject.org/pub/fedora/linux
        run: build/build-iso.sh
      - name: Refresh package cache
        run: build/cache-packages.sh
      - name: Save package cache
        uses: actions/cache/save@v4
        with:
          path: .cache/pkg-cache
          key: pkg-cache-${{ github.run_id }}
      - name: Checksums + split for GitHub's 2 GiB asset limit
        run: |
          cd out/iso
          iso=$(ls *.iso)
          if [ "$(stat -c%s "$iso")" -ge 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            rm "$iso"
          fi
          ls -lh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="snapshot-$(date +%Y%m%d)"
          gh release create "$tag" out/iso/* --title "hyprdev $tag" --generate-notes \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md
