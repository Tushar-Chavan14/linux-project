source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    path = ~/.config/hypr/wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    text = cmd[update:1000] date +"%I:%M"
    color = $pink
    font_size = 110
    font_family = Orbitron
    position = 0, 220
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text
    font_size = 18
    font_family = Inter
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    size = 320, 52
    outline_thickness = 2
    outer_color = $mauve
    inner_color = rgba(1e1e2ecc)
    font_color = $text
    check_color = $lavender
    fail_color = $red
    placeholder_text = <span foreground="##a6adc8">Password</span>
    rounding = 14
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
