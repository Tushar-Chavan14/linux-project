# Glass for shell layers
layerrule = match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window)$, blur on
# ignore_alpha: the dock bar is mostly transparent - only blur behind the visible pill
layerrule = match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window)$, ignore_alpha 0.1

# Float utility windows
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|swappy)$, float on
windowrule = match:title ^(hyprdev-welcome)$, float on, size 900 640, center on
windowrule = match:class ^(dev.hyprdev.Settings)$, float on, size 960 680, center on
