general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $mauve $lavender 45deg
    col.inactive_border = rgba(31324480)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111bcc)
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.18
        popups = true
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.9, 0.3, 1.0
    bezier = snappy, 0.2, 1.0, 0.3, 1.0
    animation = windows, 1, 5, snappy, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = border, 1, 8, default
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, smooth, fade
    animation = workspaces, 1, 5, snappy, slidefade 15%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}
