exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/hypr/scripts/wallpaper-daemon.sh
exec-once = hypridle
exec-once = waybar
exec-once = swaync
exec-once = swayosd-server
exec-once = waybar -c ~/.config/waybar/dock.jsonc -s ~/.config/waybar/dock.css
exec-once = ~/.config/eww/scripts/launch.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# First login: open the setup app once.
exec-once = ~/.config/hypr/scripts/firstboot.sh
